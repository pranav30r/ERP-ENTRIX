name: ENTRIX Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: entrix_erp
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm --prefix server ci

      - name: Compile TypeScript
        run: npm --prefix server run build

      - name: Execute Versioned Database Migrations
        run: npm --prefix server run db:migrate
        env:
          DB_PORT: 5434
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: entrix_erp

      - name: Run Complete Test Suite
        run: npm --prefix server test -- --runInBand --forceExit
        env:
          DB_PORT: 5434
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: entrix_erp
          REDIS_PORT: 6380
          REDIS_HOST: localhost
          JWT_SECRET: super_secret_jwt_key_entrix_2026_change_in_production
          JWT_REFRESH_SECRET: super_secret_refresh_key_entrix_2026_change_in_production

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm --prefix client ci

      - name: Build Vite Production Bundle
        run: npm --prefix client run build

  security-audit:
    name: Dependency Audit & Secret Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Uncommitted Credentials in Tracking
        run: |
          if git status --porcelain | grep -E '\.env$|\.env\.local|\.pem|\.key'; then
            echo "[SECURITY FAILURE] Secret or environment file tracked in git!"
            exit 1
          fi
          echo "[PASS] No secret files detected in working tree."

      - name: Inspect Package Manifests
        run: |
          npm --prefix server audit --audit-level=critical || true
          npm --prefix client audit --audit-level=critical || true
