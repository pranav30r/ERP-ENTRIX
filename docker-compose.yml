services:
  postgres:
    image: postgres:16-alpine
    container_name: entrix-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-entrix_erp}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-entrix_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - entrix-net

  redis:
    image: redis:7-alpine
    container_name: entrix-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - entrix-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: entrix-ai
    restart: always
    ports:
      - "8008:8000"
    networks:
      - entrix-net

volumes:
  postgres_data:
  redis_data:

networks:
  entrix-net:
    driver: bridge
